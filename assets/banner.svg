<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="pillGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#be185d" stop-opacity="0.05" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <style>
      @keyframes float1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(0.8deg); }
      }
      @keyframes float2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(-0.8deg); }
      }
      @keyframes float3 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(1deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.25; transform: scale(1); }
        50% { opacity: 0.55; transform: scale(1.08); }
      }
      @keyframes stream {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .card-1 { animation: float1 6s ease-in-out infinite; }
      .card-2 { animation: float2 7s ease-in-out infinite 1s; }
      .card-3 { animation: float3 8s ease-in-out infinite 0.5s; }
      .g-pulse { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .flow-line { stroke-dasharray: 12 8; animation: stream 12s linear infinite; }
      .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; }
      .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 400; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glow Spheres (Background Layer) -->
  <circle class="g-pulse" cx="200" cy="80" r="140" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />
  <circle class="g-pulse" cx="1020" cy="180" r="160" fill="#a855f7" opacity="0.18" filter="url(#glow)" />
  <circle class="g-pulse" cx="600" cy="300" r="130" fill="#ec4899" opacity="0.12" filter="url(#glow)" />

  <!-- Geometric Grid Accent Pattern -->
  <g opacity="0.06" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="90" x2="1200" y2="90" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="270" x2="1200" y2="270" />
  </g>

  <!-- Flowing Dynamic Stream Lines (Midground) -->
  <path class="flow-line" d="M 50,300 C 250,220 400,340 650,280 S 950,180 1150,220" fill="none" stroke="#60a5fa" stroke-width="2" opacity="0.4" />
  <path class="flow-line" d="M 50,80 C 300,160 550,60 800,120 S 1050,40 1150,100" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.3" />

  <!-- Dynamic Feature Badges / Floating Micro-Cards (Lower Layer, Off-Center) -->
  <g class="card-1" filter="url(#shadow)">
    <rect x="70" y="275" width="230" height="48" rx="24" fill="url(#pillGrad1)" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="95" cy="299" r="7" fill="#60a5fa" />
    <text x="115" y="304" fill="#93c5fd" font-size="13" class="sub-text" font-weight="600">⚡ Real-Time Co-Editing</text>
  </g>

  <g class="card-2" filter="url(#shadow)">
    <rect x="485" y="275" width="230" height="48" rx="24" fill="url(#pillGrad2)" stroke="#8b5cf6" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="510" cy="299" r="7" fill="#c084fc" />
    <text x="530" y="304" fill="#d8b4fe" font-size="13" class="sub-text" font-weight="600">🌐 CRDT &amp; Local-First</text>
  </g>

  <g class="card-3" filter="url(#shadow)">
    <rect x="900" y="275" width="230" height="48" rx="24" fill="url(#pillGrad3)" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="925" cy="299" r="7" fill="#f472b6" />
    <text x="945" y="304" fill="#fbcfe8" font-size="13" class="sub-text" font-weight="600">🛡️ Self-Hosted &amp; Cloud</text>
  </g>

  <!-- Foreground Title and Core Content (High Contrast, Never Obscured) -->
  <g filter="url(#shadow)">
    <!-- Category Pill -->
    <rect x="450" y="38" width="300" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="600" y="58" text-anchor="middle" fill="#38bdf8" font-size="12" class="sub-text" font-weight="700" letter-spacing="1.5">🚀 CURATED DIRECTORY &amp; ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="600" y="128" text-anchor="middle" fill="url(#titleGrad)" font-size="44" class="title-text" filter="url(#glow)">Awesome Collaborative Document Workspace</text>

    <!-- Subtitle Line 1 -->
    <text x="600" y="172" text-anchor="middle" fill="#f8fafc" font-size="20" class="sub-text" font-weight="600">The Ultimate Hub for Real-Time Co-Authoring, Knowledge Bases &amp; Team Wikis</text>

    <!-- Subtitle Line 2 / Meta (using numeric character references &#8226; instead of undefined HTML entities) -->
    <text x="600" y="206" text-anchor="middle" fill="#94a3b8" font-size="15" class="sub-text">Top SaaS Platforms &#8226; High-Star Open Source GitHub Projects &#8226; CRDT Architectures &#8226; Market Analytics</text>
  </g>

  <!-- Border Frame -->
  <rect x="1" y="1" width="1198" height="358" rx="15" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
