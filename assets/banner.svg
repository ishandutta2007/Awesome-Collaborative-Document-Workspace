<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="360" viewBox="0 0 1200 360"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#111827"/><stop offset="100%" stop-color="#1e1b4b"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#60a5fa"/><stop offset="50%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/></linearGradient><linearGradient id="pillGrad1" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#3b82f6" stop-opacity=".25"/><stop offset="100%" stop-color="#1d4ed8" stop-opacity=".05"/></linearGradient><linearGradient id="pillGrad2" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#8b5cf6" stop-opacity=".25"/><stop offset="100%" stop-color="#6d28d9" stop-opacity=".05"/></linearGradient><linearGradient id="pillGrad3" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#ec4899" stop-opacity=".25"/><stop offset="100%" stop-color="#be185d" stop-opacity=".05"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".5" stdDeviation="12"/></filter><style>@keyframes float1{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-10px) rotate(.8deg)}}@keyframes float2{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-14px) rotate(-.8deg)}}@keyframes float3{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-8px) rotate(1deg)}}@keyframes pulseGlow{0%{opacity:.25;transform:scale(1)}50%{opacity:.55;transform:scale(1.08)}}@keyframes stream{0%{stroke-dashoffset:400}}.card-1{animation:float1 6s ease-in-out infinite}.card-2{animation:float2 7s ease-in-out infinite 1s}.card-3{animation:float3 8s ease-in-out infinite .5s}.g-pulse{animation:pulseGlow 5s ease-in-out infinite;transform-origin:center}.flow-line{stroke-dasharray:12 8;animation:stream 12s linear infinite}.sub-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800}.sub-text{font-weight:400}</style></defs><rect width="1200" height="360" fill="url(#bgGrad)" rx="16"/><circle cx="200" cy="80" r="140" fill="#3b82f6" class="g-pulse" filter="url(#glow)" opacity=".15"/><circle cx="1020" cy="180" r="160" fill="#a855f7" class="g-pulse" filter="url(#glow)" opacity=".18"/><circle cx="600" cy="300" r="130" fill="#ec4899" class="g-pulse" filter="url(#glow)" opacity=".12"/><g stroke="#fff" stroke-width="1" opacity=".06"><line x1="100" x2="100" y1="0" y2="360"/><line x1="300" x2="300" y1="0" y2="360"/><line x1="500" x2="500" y1="0" y2="360"/><line x1="700" x2="700" y1="0" y2="360"/><line x1="900" x2="900" y1="0" y2="360"/><line x1="1100" x2="1100" y1="0" y2="360"/><line x1="0" x2="1200" y1="90" y2="90"/><line x1="0" x2="1200" y1="180" y2="180"/><line x1="0" x2="1200" y1="270" y2="270"/></g><path fill="none" stroke="#60a5fa" stroke-width="2" d="M 50,300 C 250,220 400,340 650,280 S 950,180 1150,220" class="flow-line" opacity=".4"/><path fill="none" stroke="#c084fc" stroke-width="2" d="M 50,80 C 300,160 550,60 800,120 S 1050,40 1150,100" class="flow-line" opacity=".3"/><g class="card-1" filter="url(#shadow)"><rect width="230" height="48" x="70" y="275" fill="url(#pillGrad1)" stroke="#3b82f6" stroke-opacity=".4" stroke-width="1.5" rx="24"/><circle cx="95" cy="299" r="7" fill="#60a5fa"/><text x="115" y="304" fill="#93c5fd" class="sub-text" font-size="13" font-weight="600">⚡ Real-Time Co-Editing</text></g><g class="card-2" filter="url(#shadow)"><rect width="230" height="48" x="485" y="275" fill="url(#pillGrad2)" stroke="#8b5cf6" stroke-opacity=".4" stroke-width="1.5" rx="24